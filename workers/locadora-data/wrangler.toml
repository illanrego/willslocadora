name = "locadora-data"
main = "src/index.mjs"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

# Exact browser origins permitted to use Better Auth and private data routes.
[vars]
ALLOWED_ORIGINS = "https://illanrego.github.io,https://sitedoillan.com.br,https://www.sitedoillan.com.br,https://willslocadora.sitedoillan.com.br,http://127.0.0.1:4173"
AUTH_BASE_URL = "https://locadora-data.willstartpage.workers.dev"
ADMIN_EMAIL = "emaildoillan@protonmail.com"
RESEND_FROM_EMAIL = "Will's Locadora <contato@mail.sitedoillan.com.br>"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e505f45c414a4fff8171530f30a64158"

# Provision and bind the shared CATALOGUE_POLICY KV namespace before deploying
# catalogue moderation. The Worker keeps the binding optional for local tests.

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "24002"

  [ratelimits.simple]
  limit = 30
  period = 60

[[kv_namespaces]]
binding = "CATALOGUE_POLICY"
id = '7ea24df984de4c9c85dff23dd9ec22b7'
